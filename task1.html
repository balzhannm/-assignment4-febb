<main class="container py-5"><a href="index.html" class="back-link">← All tasks</a><div class="form-panel mt-3"><span class="task-number">PART 1 · TASK 1</span><h1 class="h2 mt-2">Form with HTML5 Validation</h1><p class="text-secondary">Try submitting the form with missing or incorrectly formatted data to see browser validation.</p>
<form action="#" method="get">
<div class="mb-3"><label for="name" class="form-label">Name <span class="required-star">*</span></label><input id="name" name="name" type="text" class="form-control" required minlength="2" maxlength="50" placeholder="Your name"></div>
<div class="mb-3"><label for="email" class="form-label">Email <span class="required-star">*</span></label><input id="email" name="email" type="email" class="form-control" required maxlength="100" placeholder="name@example.com"></div>
<div class="mb-3"><label for="message" class="form-label">Message <span class="required-star">*</span></label><textarea id="message" name="message" class="form-control" rows="4" required minlength="10" maxlength="500" placeholder="At least 10 characters"></textarea><div class="form-text">Message length: 10–500 characters.</div></div>
<button type="submit" class="btn btn-primary">Validate and submit</button>
</form></div></main><footer class="py-4 text-center text-secondary border-top">Assignment #4 · Task 1</footer></body></html>
