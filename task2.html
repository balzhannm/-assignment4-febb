<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task 2 | Bootstrap Form</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Forms & Validation</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navMenu"><div class="navbar-nav ms-auto"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="task0.html">Task 0</a><a class="nav-link" href="task1.html">Task 1</a><a class="nav-link active" href="task2.html">Task 2</a><a class="nav-link" href="task3.html">Task 3</a><a class="nav-link" href="task4.html">Task 4</a></div></div></div></nav>
<main class="container py-5"><a href="index.html" class="back-link">← All tasks</a><div class="form-panel mt-3"><span class="task-number">PART 2 · TASK 2</span><h1 class="h2 mt-2">Bootstrap Form Styling</h1><p class="text-secondary">A responsive form using Bootstrap grid and form classes.</p>
<form action="#" method="get">
<div class="row g-3"><div class="col-md-6"><label for="name" class="form-label">Name</label><input id="name" name="name" class="form-control" type="text" required placeholder="Jane Smith"><div class="form-text">Use your first and last name.</div></div>
<div class="col-md-6"><label for="email" class="form-label">Email address</label><input id="email" name="email" class="form-control" type="email" required placeholder="jane@example.com"><div class="form-text">We will use this to reply to you.</div></div>
<div class="col-12"><label for="topic" class="form-label">Topic</label><select id="topic" name="topic" class="form-select" required><option value="" selected disabled>Choose a topic</option><option>General question</option><option>Feedback</option><option>Technical support</option></select></div>
<div class="col-12"><label for="message" class="form-label">Message</label><textarea id="message" name="message" class="form-control" rows="5" minlength="10" maxlength="500" required placeholder="How can we help?"></textarea><div class="form-text">Please write at least 10 characters.</div></div>
<div class="col-12"><button type="submit" class="btn btn-primary">Send message</button></div></div>
</form></div></main><footer class="py-4 text-center text-secondary border-top">Assignment #4 · Task 2</footer></body></html>
